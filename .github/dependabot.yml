# Dependabot proposes updates for what it can see in this repo: the GitHub
# Actions used by the workflows and the Docker base image. (It does not
# support renv, so R package updates are done by hand with renv::update().)
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    # The R version must match renv.lock (R 4.5.2), so a new R minor or major is a
    # deliberate move (update `later` and the lock, re-check the libgdal package
    # name, test a full restore on the new image), not a bump; patch releases still come
    ignore:
      - dependency-name: "rocker/r-ver"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    commit-message:
      prefix: "docker"
