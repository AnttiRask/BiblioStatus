name: Deploy to Cloud Run

# Deploys on pushes that change the app or how it is built (not the nightly
# database commit, docs or tests), once a week, and on demand. Turso is the
# primary data source; the SQLite file in the image is only the fallback when
# Turso is down. It holds a single day of schedules, so the weekly run keeps the
# fallback's library list fresh (an older image shows libraries but no
# opening status in an outage).
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "!app/libraries.sqlite"
      - "R/**"
      - "Dockerfile"
      - ".dockerignore"
      - "renv.lock"
      - ".Rprofile"
      - "renv/activate.R"
      - "renv/settings.json"
  schedule:
    - cron: "0 4 * * 1"  # Mondays 04:00 UTC, after Sunday's full data refresh
  workflow_dispatch:  # Allows manual deployment

# Never run two deploys at once (each is a full image build); a newer trigger
# waits for the running one
concurrency:
  group: deploy-cloud-run
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # The tests must pass before anything is built or deployed
  test:
    uses: ./.github/workflows/tests.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # keyless Google Cloud login (Workload Identity Federation)

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/884476669514/locations/global/workloadIdentityPools/github/providers/github-oidc
          service_account: github-deploy@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Build container image
        run: |
          BUILD_ID=$(gcloud builds submit \
            --tag europe-north1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/cloud-run-source-deploy/bibliostatus-app \
            --region europe-north1 \
            --timeout 3600 \
            --project ${{ secrets.GCP_PROJECT_ID }} \
            --async \
            --format='value(id)')

          echo "Build ID: $BUILD_ID"

          while true; do
            STATUS=$(gcloud builds describe "$BUILD_ID" \
              --region europe-north1 \
              --project ${{ secrets.GCP_PROJECT_ID }} \
              --format='value(status)')
            echo "Build status: $STATUS"
            if [ "$STATUS" = "SUCCESS" ]; then
              break
            elif [ "$STATUS" = "FAILURE" ] || [ "$STATUS" = "TIMEOUT" ] || [ "$STATUS" = "CANCELLED" ]; then
              echo "Build failed with status: $STATUS"
              echo "--- Cloud Build Logs ---"
              gcloud builds log "$BUILD_ID" \
                --region europe-north1 \
                --project ${{ secrets.GCP_PROJECT_ID }} | tail -100
              exit 1
            fi
            sleep 30
          done

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy bibliostatus-app \
            --image europe-north1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/cloud-run-source-deploy/bibliostatus-app \
            --platform managed \
            --region europe-north1 \
            --allow-unauthenticated \
            --memory 1Gi \
            --timeout 3600 \
            --service-account bibliostatus-runtime@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com \
            --max-instances 3 \
            --concurrency 80 \
            --session-affinity \
            --remove-env-vars TURSO_DATABASE_URL,TURSO_AUTH_TOKEN \
            --set-secrets TURSO_DATABASE_URL=turso-database-url:latest,TURSO_AUTH_TOKEN=turso-auth-token:latest \
            --update-labels "git-sha=${GITHUB_SHA::12}" \
            --project ${{ secrets.GCP_PROJECT_ID }}

      # Fails the run unless the service carries this commit's label and the
      # page answers HTTP 200
      - name: Smoke test the deployed service
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          DESCRIBE_FORMAT='value(status.url,metadata.labels.git-sha)'
          read -r URL LABEL < <(gcloud run services describe bibliostatus-app \
            --project "$PROJECT_ID" --region europe-north1 --format="$DESCRIBE_FORMAT")
          echo "Service URL: $URL"
          echo "Deployed commit label: $LABEL (this run: ${GITHUB_SHA::12})"
          if [ "$LABEL" != "${GITHUB_SHA::12}" ]; then
            echo "The service doesn't carry this commit's label"
            exit 1
          fi
          for attempt in 1 2 3 4 5; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 "$URL/" || true)
            echo "Attempt $attempt: HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "OK"
              exit 0
            fi
            sleep 10
          done
          echo "Service did not return HTTP 200"
          exit 1
