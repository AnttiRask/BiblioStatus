name: Check Library URLs

on:
  schedule:
    - cron: "0 3 * * *"  # Runs daily at 3 am UTC (after data fetch)
  workflow_dispatch:  # Allows manual triggering

permissions:
  contents: read

jobs:
  check_urls:
    # Pinned, not ubuntu-latest: the label moved to Ubuntu 26.04 on 2026-10-31 (seen on
    # 2026-11-01), and this project is built for 24.04, like the production image
    # (rocker/r-ver:4.5.2): `libgdal34t64` exists only there, and `later` 1.4.1 from
    # renv.lock does not compile on 26.04 (glibc/GCC 15). Move to a newer Ubuntu on
    # purpose, after updating `later` in the lock and testing a full restore there.
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies
        timeout-minutes: 10
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends libcurl4-openssl-dev libssl-dev

      - name: Cache R packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/R/renv
          key: ${{ runner.os }}-renv-${{ hashFiles('renv.lock') }}
          restore-keys: |
            ${{ runner.os }}-renv-

      - name: Setup R
        uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          r-version: 'renv'

      - name: Restore R Dependencies
        run: Rscript -e 'renv::restore()'

      - name: Check library URLs
        id: check_urls
        run: |
          Rscript check_library_urls.R > url_check_output.txt 2>&1
          echo "exit_code=$?" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Read output file
        if: always()
        run: cat url_check_output.txt

      - name: Send email if broken URLs found
        if: failure() || contains(steps.check_urls.outputs.exit_code, '1')
        uses: dawidd6/action-send-mail@27bf7a883db6de205849f760badd38a1a3ce0dd0 # v23 (third-party, pinned to a commit; handles the mail password)
        with:
          server_address: smtp.gmail.com
          server_port: 587
          # STARTTLS on port 587: refuse to send the password if the server doesn't negotiate it
          require_tls: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "BiblioStatus: Broken Library URLs Detected"
          to: anttilennartrask@gmail.com
          # v23 needs an address in `from` (v3 added the SMTP username to a bare name):
          # a bare name is rejected with "'from' address is invalid"
          from: "BiblioStatus URL Checker <${{ secrets.EMAIL_USERNAME }}>"
          body: |
            Broken library URLs were detected during the daily check.

            See the full report in the GitHub Actions run:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            ---
            ${{ steps.check_urls.outputs.output }}
          attachments: url_check_output.txt
