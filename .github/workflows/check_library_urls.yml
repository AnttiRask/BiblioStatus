name: Check Library URLs

on:
  schedule:
    - cron: "0 3 * * *"  # Runs daily at 3 am UTC (after data fetch)
  workflow_dispatch:  # Allows manual triggering

permissions:
  contents: read

jobs:
  check_urls:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev

      - name: Cache R packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/R/renv
          key: ${{ runner.os }}-renv-${{ hashFiles('renv.lock') }}
          restore-keys: |
            ${{ runner.os }}-renv-

      - name: Setup R
        uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          r-version: 'renv'

      - name: Restore R Dependencies
        run: Rscript -e 'renv::restore()'

      - name: Check library URLs
        id: check_urls
        run: |
          Rscript check_library_urls.R > url_check_output.txt 2>&1
          echo "exit_code=$?" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Read output file
        if: always()
        run: cat url_check_output.txt

      - name: Send email if broken URLs found
        if: failure() || contains(steps.check_urls.outputs.exit_code, '1')
        uses: dawidd6/action-send-mail@4226df7daafa6fc901a43789c49bf7ab309066e7 # v3 (third-party, pinned to a commit; handles the mail password)
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "BiblioStatus: Broken Library URLs Detected"
          to: anttilennartrask@gmail.com
          from: BiblioStatus URL Checker
          body: |
            Broken library URLs were detected during the daily check.

            See the full report in the GitHub Actions run:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            ---
            ${{ steps.check_urls.outputs.output }}
          attachments: url_check_output.txt
