name: Fetch Library Data

on:
  schedule:
    - cron: "0 2 * * *"  # Daily at 2 AM UTC; Sunday runs fetch both (see Determine update type step)
  workflow_dispatch:  # Manual triggering
    inputs:
      update_type:
        description: 'What to update'
        required: true
        default: 'schedules'
        type: choice
        options:
          - schedules
          - libraries
          - both

permissions:
  contents: write

jobs:
  fetch_data:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No GDAL: the script doesn't use any spatial package (terra/raster sit in
      # renv.lock but are never loaded). The big GDAL download stalled this step
      # for good once, and a stuck step blocks the whole data update (the app then
      # has no opening hours), so downloads retry and the step is capped.
      - name: Install system dependencies
        timeout-minutes: 10
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends libcurl4-openssl-dev libssl-dev libxml2-dev libpng-dev

      - name: Cache R packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/R/renv
          key: ${{ runner.os }}-renv-${{ hashFiles('renv.lock') }}
          restore-keys: |
            ${{ runner.os }}-renv-

      - name: Setup R
        uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          r-version: 'renv'

      - name: Restore R Dependencies
        run: Rscript -e 'renv::restore()'

      - name: Determine update type
        id: update-type
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "$(date +%u)" = "7" ]; then
              echo "type=both" >> $GITHUB_OUTPUT
            else
              echo "type=schedules" >> $GITHUB_OUTPUT
            fi
          else
            echo "type=${{ inputs.update_type }}" >> $GITHUB_OUTPUT
          fi

      - name: Fetch library data
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          UPDATE_TYPE: ${{ steps.update-type.outputs.type }}
        run: Rscript fetch_library_data.R

      - name: Commit and push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.email "github-actions@users.noreply.github.com"
          git config --global user.name "GitHub Actions"
          git add app/libraries.sqlite data/library_coordinates.csv
          git commit -m "Update database $(date -u +"%Y-%m-%d %H:%M UTC")" || echo "No changes to commit"
          git pull --rebase https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git main
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git main
