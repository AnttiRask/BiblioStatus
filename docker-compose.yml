services:
  shiny-app:
    build: .
    ports:
      - "8082:8080"
    # Turso credentials for local development (git-ignored, see CLAUDE.md)
    env_file:
      - .Renviron
    environment:
      - PORT=8080
      - SHINY_ENV=development
    volumes:
      # Mount for development - allows live code changes
      - ./app:/app/app
    restart: unless-stopped
